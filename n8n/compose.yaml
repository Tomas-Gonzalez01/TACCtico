name: tacctico-n8n

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.48.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: America/Argentina/Buenos_Aires
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Ejecutar python preparar_entorno.py primero}
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./storage:/files:ro

  task-runners:
    build:
      context: .
      dockerfile: runners.Dockerfile
    image: tacctico-n8n-runners:2.48.5
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_TIMEOUT: "300"
    depends_on:
      - n8n
    volumes:
      - ./storage:/files

volumes:
  n8n_data:
    name: tacctico_n8n_data
